name: Project proposal
description: Propose a small game, tool, resource, or community project.
title: "[Project] "
labels:
  - project
body:
  - type: markdown
    attributes:
      value: "Only submit work you have the right to share. Do not include proprietary game files or copied assets."
  - type: input
    id: name
    attributes:
      label: Project name
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: What is it and who is it for?
    validations:
      required: true
  - type: textarea
    id: first_version
    attributes:
      label: What is the smallest testable first version?
    validations:
      required: true
  - type: textarea
    id: legal
    attributes:
      label: Ownership and licence
      description: Explain what you own, what third-party licences apply, and how the project can be shared.
    validations:
      required: true
  - type: textarea
    id: technology
    attributes:
      label: Technology, dependencies, and help needed
      description: List the planned stack, important dependencies, and what support you are asking from GankByte.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof or first test
      description: Link a build, example, screenshot, or explain how someone can reproduce the first test. Write "not available yet" if this is still an idea.
    validations:
      required: true
