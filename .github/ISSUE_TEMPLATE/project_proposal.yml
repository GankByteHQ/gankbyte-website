name: Project proposal
description: Propose a small game, tool, resource, or community project.
title: "[Project] "
labels:
  - project
body:
  - type: markdown
    attributes:
      value: "Only submit work you have the right to share. Do not include proprietary game files or copied assets."
  - type: input
    id: name
    attributes:
      label: Project name
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: What is it and who is it for?
    validations:
      required: true
  - type: textarea
    id: first_version
    attributes:
      label: What is the smallest testable first version?
    validations:
      required: true
  - type: textarea
    id: legal
    attributes:
      label: Ownership and licence
      description: Explain what you own, what third-party licences apply, and how the project can be shared.
    validations:
      required: true
