name: Bug report
description: Report a reproducible problem in a GankByte project.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Please do not include passwords, private keys, secret tokens, or personal information."
  - type: input
    id: project
    attributes:
      label: Project or page
      placeholder: Byte Rush, Glitch Dash, website, XP
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include the steps to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and browser
      placeholder: Windows 11, Chrome
    validations:
      required: true
