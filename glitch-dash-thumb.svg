<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Glitch Dash game scene</title>
  <desc id="desc">Three lanes with a bright safe gap, purple glitch gates, and a lime player marker.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#10131b"/><stop offset="1" stop-color="#221b38"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <g stroke="#f4f2ea" stroke-opacity=".14"><path d="M0 108h960M0 210h960M0 312h960"/><path d="M0 70h960M0 350h960" stroke-dasharray="3 14"/></g>
  <g fill="#9a7bff" opacity=".86"><rect x="650" y="68" width="48" height="82"/><rect x="650" y="272" width="48" height="82"/><rect x="805" y="68" width="48" height="82"/><rect x="805" y="272" width="48" height="82"/></g>
  <rect x="650" y="170" width="48" height="80" fill="#c6ff3d" fill-opacity=".12" stroke="#c6ff3d" stroke-opacity=".65"/>
  <g filter="url(#glow)" fill="#c6ff3d"><path d="m165 210 28-28 28 28-28 28z"/></g>
  <circle cx="193" cy="210" r="34" fill="none" stroke="#7de7ff" stroke-opacity=".8"/>
  <circle cx="520" cy="210" r="12" fill="#ffb45c"/><text x="520" y="214" fill="#0a0b0f" font-family="Arial,sans-serif" font-size="9" font-weight="700" text-anchor="middle">2X</text>
  <text x="28" y="35" fill="#c6ff3d" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">GLITCH DASH // LIVE</text>
  <text x="932" y="390" fill="#98979b" font-family="Arial,sans-serif" font-size="12" text-anchor="end" letter-spacing="2">READ THE GAP // KEEP MOVING</text>
</svg>
